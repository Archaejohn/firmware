; PagerUI - an in-tree color UI, built for the LilyGo T-Lora Pager's 480x222 panel.
;
; Structured after src/graphics/niche/InkHUD/PlatformioConfig.ini: an alternative UI stack
; that replaces BaseUI wholesale rather than rendering through it. Envs opt in by extending
; this section; see [env:tlora-pager-chat] in variants/esp32s3/tlora-pager/platformio.ini.
;
; Unlike InkHUD this deliberately keeps InputBroker and HAS_BUTTON: the pager's TCA8418
; keyboard and rotary encoder are built inside InputBroker::Init(), so
; MESHTASTIC_EXCLUDE_INPUTBROKER would leave the device with no input at all.
[pagerui]
build_src_filter =
  +<graphics/PagerUI/> ; The UI itself
  -<graphics/draw/> ; BaseUI renderer stack is replaced, not extended
  -<graphics/fonts/> ; BaseUI OLEDDisplay font tables
  -<graphics/EInkDisplay2.cpp>
  -<graphics/EInkDynamicDisplay.cpp>
  -<graphics/EInkParallelDisplay.cpp>
  -<graphics/EmoteRenderer.cpp>
  -<graphics/emotes.cpp>
  -<graphics/Panel_sdl.cpp>
  -<graphics/ScreenGlobals.cpp>
  -<graphics/SharedUIDisplay.cpp>
  -<graphics/TFTColorRegions.cpp> ; The 1-bit + 48-color-region scheme PagerUI exists to replace
  -<graphics/TFTDisplay.cpp> ; PagerUI drives LovyanGFX directly
  -<graphics/tftSetup.cpp> ; MUI/device-ui bootstrap
  -<graphics/VirtualKeyboard.cpp> ; The pager has a real keyboard
; Deliberately NOT subtracted:
;   graphics/Screen.cpp      - self-guarding; at HAS_SCREEN 0 it compiles to the stub in
;                              Screen.h and still supplies shouldWakeOnReceivedMessage(),
;                              which sits outside the guard and is called from
;                              TextMessageModule.
;   graphics/TimeFormatters.cpp - UI-agnostic; PagerUI reuses it for relative timestamps.
build_flags =
  -D MESHTASTIC_INCLUDE_PAGERUI ; Use PagerUI
  -D MESHTASTIC_EXCLUDE_SCREEN ; Suppress BaseUI's Screen class (forces HAS_SCREEN 0)
  -D MESSAGE_HISTORY_LIMIT=400 ; Deep history; the pager has 16MB flash and 8MB PSRAM
  -D MESSAGE_TEXT_POOL_SIZE=65536
  -I src/graphics/PagerUI ; so LVGL finds our lv_conf.h
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
lib_deps =
  # renovate: datasource=github-tags depName=lvgl packageName=lvgl/lvgl
  https://github.com/lvgl/lvgl/archive/refs/tags/v9.3.0.zip
